name: Release Windows

on:
  push:
    branches: [Implementacion-de-Tauri-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/Implementacion-de-Tauri-v2'
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Test character unlocks
        run: pnpm test:characters

      - name: Test settings and Steam discovery
        run: pnpm test:settings

      - name: Build Windows installer and executable
        run: pnpm exec -- tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Package release assets
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDate = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'Pacific SA Standard Time')
          $version = $releaseDate.ToString('yyMMdd')
          $name = "Release-$version"
          $tag = "$name-build.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $releaseDir = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $binary = Join-Path $releaseDir 'IsaacSketchbook.exe'
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $releaseDir 'bundle/nsis') -Filter '*-setup.exe' -File)
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Application executable missing' }
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer; found $($installers.Count)" }

          $output = Join-Path $env:RUNNER_TEMP 'isaac-release'
          $portable = Join-Path $env:RUNNER_TEMP 'isaac-portable'
          New-Item -ItemType Directory -Path $output, $portable | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path $output "IsaacSketchbook-$version-windows-x64-setup.exe")
          Copy-Item -LiteralPath $binary -Destination (Join-Path $portable 'IsaacSketchbook.exe')
          Compress-Archive -LiteralPath (Join-Path $portable 'IsaacSketchbook.exe') -DestinationPath (Join-Path $output "IsaacSketchbook-$version-windows-x64-portable.zip")

          $notes = @'
          Compilación automática de IsaacSketchbook para Windows x64.

          - **Instalador:** descarga y ejecuta el archivo `*-setup.exe`.
          - **Portable:** extrae el ZIP en una carpeta con permiso de escritura y ejecuta `IsaacSketchbook.exe`. Requiere Microsoft Edge WebView2 Runtime instalado.
          - La configuración se guarda como `settings.json` junto al ejecutable.

          '@
          $notes += "`nCommit: $env:GITHUB_SHA"
          $notesPath = Join-Path $env:RUNNER_TEMP 'isaac-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "assets=$output" >> $env:GITHUB_OUTPUT
          "notes=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_NAME: ${{ steps.package.outputs.name }}
          RELEASE_ASSETS: ${{ steps.package.outputs.assets }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath $env:RELEASE_ASSETS -File | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw 'Expected installer and portable ZIP' }
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title $env:RELEASE_NAME --notes-file $env:RELEASE_NOTES
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
